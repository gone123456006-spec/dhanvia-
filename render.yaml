# Render Blueprint: Dashboard > New > Blueprint > select this repo.
services:
  - type: web
    name: dhanvia-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --enable-source-maps dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dhanvia
      # The frontend is hosted on Vercel, which proxies /api here.
      - key: SERVE_FRONTEND
        value: "false"
      # Vercel's proxy + Render's load balancer sit in front of the app.
      - key: TRUST_PROXY
        value: "2"
      - key: CORS_ORIGIN
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: REMINDER_INTERVAL_MINUTES
        value: "5"
