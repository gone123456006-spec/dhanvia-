# Render Blueprint: Dashboard > New > Blueprint > select this repo.
# One web service serves the API (and a copy of the website). The public site is on Vercel,
# which forwards /api/* here (see vercel.json).
services:
  - type: web
    name: dhanvia-webapi
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix backend ci --include=dev && npm run build:all
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dhanvia
      - key: SERVE_FRONTEND
        value: "true"
      # Vercel's proxy + Render's load balancer sit in front of the app.
      - key: TRUST_PROXY
        value: "2"
      - key: CORS_ORIGIN
        value: https://www.dhanvia.com,https://dhanvia.com,https://dhanvia-frontend.vercel.app,https://dhanvia-webapi.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: REMINDER_INTERVAL_MINUTES
        value: "5"
      - key: RUN_JOBS
        value: "true"
